name: Build Jarvis EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --collect-all AppOpener --collect-all pywhatkit jarvis.py
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-exe
          path: dist/jarvis.exe
